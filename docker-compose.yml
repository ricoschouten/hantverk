# Local test server. In one terminal run `packwiz serve`, then `docker compose up`.
services:
  mc:
    image: itzg/minecraft-server:latest
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
      TYPE: FABRIC
      VERSION: "26.3"
      FABRIC_LOADER_VERSION: "0.20.1"
      PACKWIZ_URL: http://host.docker.internal:8080/pack.toml
      MEMORY: 4G
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./server-data:/data
