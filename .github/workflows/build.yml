name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v32

      - name: Check index is up to date
        run: |
          nix develop -c packwiz refresh
          git diff --exit-code || { echo "::error::Run 'packwiz refresh' and commit the result"; exit 1; }

      - name: Build test server
        run: nix build .#server --no-link

      - name: Export .mrpack
        run: |
          mkdir -p dist
          nix develop -c packwiz modrinth export -o "dist/hantverk-${GITHUB_REF_NAME//\//-}.mrpack"

      - uses: actions/upload-artifact@v7
        with:
          name: hantverk-mrpack
          path: dist/*.mrpack

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.mrpack --generate-notes
