name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
          cache: false

      - name: Install packwiz (pinned)
        run: go install github.com/packwiz/packwiz@v0.0.0-20261014010756-170b22d78595

      - name: Check index is up to date
        run: |
          packwiz refresh
          git diff --exit-code || { echo "::error::Run 'packwiz refresh' and commit the result"; exit 1; }

      - name: Export .mrpack
        run: |
          mkdir -p dist
          packwiz modrinth export -o "dist/hantverk-${GITHUB_REF_NAME//\//-}.mrpack"

      - uses: actions/upload-artifact@v7
        with:
          name: hantverk-mrpack
          path: dist/*.mrpack

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.mrpack --generate-notes
